# 禁用词扫描配置
# 判定流程：分词表 → 分类判定 → 模板白名单
# 三层机制：N1/N3 自动规则（85%）→ N2 语境豁免（10%，标 needs_human_confirm）
#          → 人工 exemption（5%，需署名）

version: 2026-10-20

# ---------------------------------------------------------------------------
# 层 1 · 强禁词：任何字段都不得出现（模板白名单只豁免层 2）
# ---------------------------------------------------------------------------
strong_banned:
  - 稳赚
  - 必涨
  - 必跌
  - 必赚
  - 稳赢
  - 稳赚不赔
  - 保证收益
  - 一定能赚
  - 一定能涨
  - 肯定涨
  - 躺赚
  - 包赚
  - 保本
  - 无风险套利
  - 零风险
  - 翻倍收益
  - 一夜暴富
  - 内幕消息
  - 内部消息
  - 保证不亏
  - 亏不了

# ---------------------------------------------------------------------------
# 层 1.5 · 词库术语白名单：本身是被解释的对象，不是操作建议
# 例：「止损」是产品 §7.7 买卖操作类的正式术语
# ---------------------------------------------------------------------------
term_whitelist:
  - 止损
  - 止盈
  - 买入
  - 卖出
  - 持有
  - 加仓
  - 减仓
  - 清仓
  - 建仓
  - 补仓
  - 追高
  - 抄底
  - 割肉
  - 满仓
  - 空仓

# ---------------------------------------------------------------------------
# 层 2 · 弱禁词：进入分类判定
# ---------------------------------------------------------------------------
weak_banned:
  # 决策动词
  - 买
  - 卖
  - 建议
  - 目标价
  - 目标位
  - 买点
  - 卖点
  - 值得入手
  - 值得关注
  - 值得关注吗
  - 首选
  - 该买
  - 该卖
  # 操作动词
  - 加仓
  - 满仓
  - 减仓
  - 清仓
  - 建仓
  - 补仓
  - 抄底
  - 追高
  - 割肉
  - 持有
  - 观望
  - 布局
  - 埋伏
  - 进场
  - 出货
  - 拉高
  - 砸盘
  # 判断形容词
  - 便宜
  - 贵
  - 值得
  - 稳
  - 靠谱
  - 翻倍
  - 暴涨
  - 暴跌

# ---------------------------------------------------------------------------
# N1 · 名词化后缀豁免（自动）
# 命中词后紧跟以下后缀 → 判为名词性用法 → 放行
# ---------------------------------------------------------------------------
noun_suffixes:
  - 方
  - 者
  - 端
  - 阵营
  - 力量
  - 意愿
  - 行为
  - 操作
  - 动作
  - 决策
  - 依据
  - 心态
  - 情绪
  - 面
  - 费
  - 差
  - 量
  - 率
  - 款
  - 账
  - 单
  - 盘
  - 股
  - 仓
  - 市
  - 场
  - 款

# 显式名词性白名单（不靠后缀规则，直接放行）
noun_explicit:
  - 买方
  - 卖方
  - 多方
  - 空方
  - 接盘方
  - 交易方
  - 持有者
  - 投资者
  - 机构
  - 散户
  - 主力
  - 庄家
  - 券商
  - 交易所
  - 监管
  - 证监会
  - 央行
  - 财政部
  - 统计局
  - 基金
  - 信托
  - 银行

# ---------------------------------------------------------------------------
# N2 · 语境豁免（自动，但标 needs_human_confirm）
# 命中词在窗口 ±10 字内出现以下词 → 判为名词性/描述性用法 → 放行
# ---------------------------------------------------------------------------
context_indicators:
  - 指
  - 表示
  - 是
  - 意味着
  - 指代
  - 一方的
  - 参与方
  - 对手方
  - 持有者
  - 参与者
  - 主体
  - 角色
  - 区别
  - 含义
  - 意思
  - 简称
  - 全称
  - 缩写
  - 说法
  - 叫法
  - 概念
  - 定义

# ---------------------------------------------------------------------------
# N3 · 否定式提醒豁免（自动）
# 命中词前 6 字内出现以下词 → 判为劝阻/澄清 → 放行
# ---------------------------------------------------------------------------
negation_prefixes:
  - 不
  - 别
  - 勿
  - 避免
  - 不能
  - 不要
  - 禁止
  - 严禁
  - 切忌
  - 并非
  - 不是
  - 无法
  - 不足以
  - 不等于
  - 不代表
  - 不构成
  - 不应
  - 不看
  - 不追
  - 不加
  - 不满
  - 不清
  - 不建
  - 不持
  - 不观望

# ---------------------------------------------------------------------------
# N4 · 祈使组合 → BLOCK（优先级最高，先于 N1/N2/N3 判定）
# ---------------------------------------------------------------------------
imperative_person: [你, 您, 咱们]
imperative_modal: [应该, 该, 可以, 最好, 不妨, 需要, 要, 别忘, 务必]
imperative_lead: [建议, 请, 务必, 切记, 千万别, 一定要]
imperative_urgent: [赶紧, 赶快, 抓紧, 快去, 错过就没, 最后机会, 上车]
imperative_valued: [值得, 应该]
imperative_valued_follow: [入手, 关注, 买入, 加仓]
imperative_window: 8   # 命中词需在 8 字内

# ---------------------------------------------------------------------------
# contextual 语境词（Layer B 中 kind=contextual 的词）的搭配判定
# 出现搭配词 → 判为黑话/投资判断 → 违规
# ---------------------------------------------------------------------------
contextual_patterns:
  - word: 便宜
    with: [股票, 股价, 估值, 市盈率, P/E, PE, 买, 入手, 便宜货]
  - word: 贵
    with: [股票, 股价, 估值, 市盈率, P/E, PE, 买, 入手]
  - word: 值得
    with: [买, 入手, 关注, 投资, 配置, 持有, 推荐]
  - word: 翻倍
    with: [收益, 赚, 涨幅, 空间, 利润, 回报]
  - word: 情绪
    with: [市场, 恐慌, 亢奋, 冰点, 高潮]
  - word: 衰退
    with: [经济, 市场, 需求, 周期]
  - word: 过热
    with: [经济, 市场, 估值, 板块]
  - word: 收紧
    with: [政策, 货币, 流动性, 银根]
  - word: 宽松
    with: [政策, 货币, 流动性, 银根]
  - word: 操纵
    with: [市场, 股价, 交易, 账户]
  - word: 内幕
    with: [消息, 信息, 交易, 交易员]
  - word: 老师
    with: [带单, 推荐, 荐股, 直播, 课程]
  - word: 踩坑
    with: [投资, 股市, 股票, 基金]
  - word: 价值投资
    with: [稳赚, 长期, 主义, 就能]
  - word: 长期主义
    with: [稳赚, 必涨, 无风险, 就能]
  - word: 机构
    with: [看好, 推荐, 买入, 上调, 目标]
  - word: 主力
    with: [买入, 拉高, 在建仓, 在出货]
  - word: 庄家
    with: [吸筹, 拉升, 洗盘, 在出货]

# ---------------------------------------------------------------------------
# 祈使句式检测（IMP-001）—— 独立于禁用词，用于检测纯祈使句
# ---------------------------------------------------------------------------
imperative_patterns:
  - id: P1
    pattern: /(你|您|咱们)\s*(应该|该|可以|最好|不妨|需要|要|别忘|务必)\s*[\u4e00-\u9fa5]{1,6}/
  - id: P2
    pattern: /(建议|请|务必|切记|千万别|一定要)\s*[\u4e00-\u9fa5]{1,6}/
  - id: P3
    pattern: /(赶紧|赶快|抓紧|快去|错过就没|最后机会|上车)/
  - id: P4
    pattern: /(值得|应该)\s*(入手|关注|买入|加仓)/
  - id: P5
    pattern: /^(买|卖|加仓|满仓|清仓|建仓|补仓|止损|止盈|持有|观望|追高|抄底|割肉)[，,、。]/

# 字段级策略
imperative_field_policy:
  plain_explain: block      # 人话层是纯事实陈述层，连"你不要追高"也阻断
  example: block
  advanced_explain: review
  pro_explain: allow
  not_meaning: allow       # 职责就是劝阻
  risk_note: allow
  confusion: review

