# 误用命题库 —— "这不代表什么"型干扰项的唯一来源
#
# 【关键设计决策】禁止从 not_meaning 自动反转生成干扰项。
#   not_meaning 是「澄清说明」（30-60 字，给用户读）；
#   误用命题是「错误选项」（≤30 字，给用户做选择）。
#   语义方向相反、长度要求不同、审核标准不同，合并会让两边质量都下降。
#
# 写法约束（CI 校验）：
#   MISC-001 claim 长度 10-30 字
#   MISC-002 与关联词条 plain_explain 的 dice3 < 0.5
#   MISC-003 禁用词零命中（复用 banned-words.yaml）
#   MISC-004 term_id 必须存在于词库
#   MISC-005 reviewed_by 非空
#   MISC-006 claim 必须是完整的「错命题」，不能是「不能这样说」
#   MISC-007 claim 与该词条 not_meaning 的语义方向必须相反
#            （用否定词出现检查：claim 中不得含 不/别/勿/不能/不要/不等于）

