        example: 比如一只股票十年涨三倍，不调整除权缺口看可能像跌了。
        notMeaning: 不复权看老 K 线全是「假跌」，做技术分析前先问自己复权没有。
        isPrimary: true
        contextKeywords:
          - 价格调整
        frequency: mid
