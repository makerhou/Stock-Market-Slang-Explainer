        aliasType: primary
      - raw: 前复权
        aliasType: cn_alias
      - raw: 后复权
        aliasType: cn_alias
      - raw: 除权价
        aliasType: cn_alias
    viz:
      type: ExRightAdjust
      config:
        title: 复权：把砍掉的接回去
    insights:
      affects:
        - 技术分析：均线、突破都要用复权价
        - 业绩归因：真实收益=复权后的
      good:
        - 前复权：以最新价为基准看历史
        - 避免误判假突破
      bad:
        - 不复权分析：被除权缺口骗
        - 口径混淆：前后复权别混用
      policy:
        - 交易所提供复权因子
        - 软件默认设置不同要留意
      example: 通货膨胀调整：爷爷说他当年工资 50 块，折成今天的购买力才知高不高——复权就是给股价做通胀调整。
