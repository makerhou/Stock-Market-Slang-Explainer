      - raw: 市销率
        aliasType: primary
      - raw: PS
        aliasType: en_alias
      - raw: price to sales
        aliasType: en_alias
    viz:
      type: PEScale
      config:
        ratioName: 市销率
        denomLabel: 每年收入(每股)
        denomMax: 20
        cheap: 2
        fair: 8
    insights:
      affects:
        - 成长股：亏损期的主估值指标
        - 行业对比：不同毛利率的行业基准不同
        - 并购：早期互联网投资的标尺
      good:
        - 收入高增长市销率合理：市场买未来
        - 规模效应显现后利润释放
      bad:
        - 烧钱补贴的收入：转化差
        - 行业天花板可见时高市销率难维持
      policy:
        - 反垄断影响平台收入模式
        - 补贴/价格战政策约束
      example: 看摊煎饼的摊位值多少钱：不看他赚多少（可能亏本），先看他每天摊多少张（收入）。摊得多，摊位估值高。
  - slug: shi-zhi
    headword: 市值
    categoryL1: 估值财务
    categoryL2: 规模
    difficulty: L3
    summaryPlain: 公司总股本乘以当前股价得到的总价值，代表市场在当下给这家公司的定价规模。
    riskNote: 价格由交易决定，市值会随股价剧烈波动，不等于公司账上真有这么多钱。
    frequency: high
    popularity: 900
    senses:
      - senseKey: default
        plainExplain: 公司总股本乘以当前股价得到的总价值，代表市场在当下给这家公司的定价规模。
        example: 比如一家公司发行在外的股数乘上现价，得到的那个天文数字就是它在牌价上的体量。
        notMeaning: 价格由交易决定，市值会随股价剧烈波动，不等于公司账上真有这么多钱。
        isPrimary: true
        contextKeywords:
          - 总市值
          - 体量
          - 估值
          - 大盘股
        frequency: high
    aliases:
      - raw: 市值
        aliasType: primary
    viz:
      type: MarketCapBar
      config: {}
    insights:
      affects:
        - 公司在市场里的‘体重’
        - 指数权重、机构能不能买
        - 抗风险能力
      good:
        - 大市值=稳如大象、波动小
        - 小市值=弹性大、易炒作
      bad:
        - 小市值=易被操控、抗跌弱
        - 过大也可能涨不动
      policy:
        - 股价×股本决定市值
        - 增发、回购会改变它
      example: 股价 10 元×10 亿股=100 亿市值，这头‘猪’重 100 亿。市值越大越像大象走得稳；越小越像兔子蹦得高也易被叼走。
