        example: 比如公司全年赚 10 亿，股本 5 亿股，每股收益就是 2 元。
        notMeaning: 一次性收益（卖房、补贴）会美化它，要看「扣非」后的真实赚钱能力。
        isPrimary: true
        contextKeywords:
          - 每股指标
        frequency: high
