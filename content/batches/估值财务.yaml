        aliasType: primary
      - raw: 每股收益
        aliasType: cn_alias
      - raw: earnings per share
        aliasType: en_alias
    viz:
      type: EarningsSeason
      config:
        expectEps: 1.5
    insights:
      affects:
        - 估值：PE=股价÷EPS
        - 业绩：EPS 增速是股价的核心驱动
        - 分红：EPS×分红率=每股分红
      good:
        - 持续增长：盈利能力强
        - 超预期：市场用脚投票
      bad:
        - 负值：公司在亏钱
        - 靠非经常项目增厚：水分大
      policy:
        - 会计准则变化影响计算
        - 股本变动（回购/增发）改变摊薄
      example: 全班 40 人一起接了个 2000 元的活：每人分 50 元（EPS）。人多活少，分到的就薄。
