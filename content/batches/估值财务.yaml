        example: 比如芯片厂一年买设备建厂房花数百亿，自由现金流常年为负。
        notMeaning: 开支过猛可能拖垮现金流，该花不花又会丢掉竞争力，平衡很难。
        isPrimary: true
        contextKeywords:
          - 现金流
        frequency: mid
    aliases:
