        - 开支纪律：现金流稳健的保障
      bad:
        - 无节制开支：现金流失血
      policy:
        - 产业政策引导投资方向
      example: 咖啡店生意再好，隔三差五换设备：赚的钱都进了设备商口袋，自己攒不下。
  - slug: zi-chan-fu-zhai-lv
    headword: 资产负债率
    categoryL1: 估值财务
    categoryL2: 偿债能力
    difficulty: L2
    summaryPlain: 总负债占总资产的比例：公司架子是不是靠借钱搭起来的。
    riskNote: 不同行业合理水平天差地别，银行负债率 90% 很正常，制造业 70% 就危险。
    frequency: high
    popularity: 700
    senses:
      - senseKey: default
        plainExplain: 总负债占总资产的比例：公司架子是不是靠借钱搭起来的。
        example: 比如一家公司资产 100 亿、负债 60 亿，比例就是 60%，银行地产这很常见，制造业就偏险。
        notMeaning: 不同行业合理水平天差地别，银行负债率 90% 很正常，制造业 70% 就危险。
        isPrimary: true
        contextKeywords:
          - 偿债能力
        frequency: high
    aliases:
      - raw: 资产负债率
        aliasType: primary
      - raw: D/A
        aliasType: en_alias
      - raw: 负债率
        aliasType: cn_alias
    viz:
      type: PoolDilution
      config:
        title: 负债 vs 股东的盘子
    insights:
      affects:
        - 风险：利率上行时高杠杆公司最疼
        - 再融资：负债率高的公司发债难
        - 周期：顺周期加杠杆放大波动
      good:
        - 低负债：抗风险强，有加杠杆空间
        - 去杠杆完成：财务费用下降
      bad:
        - 过高：利息吞掉利润
        - 短债长投：流动性断裂风险
      policy:
        - 货币政策松紧影响债务成本
        - 行业监管对杠杆的红线（如地产三条红线）
      example: 首付 30% 买 300 万的房：负债率 70%。房价涨你赚倍数，房价跌+利率涨，断供就被扫地出门。
  - slug: zi-you-xian-jin-liu
    headword: 自由现金流
    categoryL1: 估值财务
    categoryL2: 现金流
    difficulty: L2
    summaryPlain: 经营现金流减去维持生意必须花的钱后，真正可自由支配的现金：公司的真血液。
    riskNote: 利润是观点、现金是事实；长期自由现金流为负的公司，故事再美也危险。
    frequency: high
    popularity: 700
    senses:
      - senseKey: default
        plainExplain: 经营现金流减去维持生意必须花的钱后，真正可自由支配的现金：公司的真血液。
        example: 比如一年经营进账 1 亿，设备维护扩张要花 6000 万，能自由支配的只有 4000 万。
        notMeaning: 利润是观点、现金是事实；长期自由现金流为负的公司，故事再美也危险。
        isPrimary: true
        contextKeywords:
          - 现金流
        frequency: high
    aliases:
      - raw: 自由现金流
        aliasType: primary
      - raw: FCF
        aliasType: en_alias
      - raw: free cash flow
        aliasType: en_alias
    viz:
      type: ProfitLossScale
      config:
        income: 100
        cost: 60
    insights:
      affects:
        - 估值：DCF 贴现的就是自由现金流
        - 分红回购能力：现金才是底气
        - 偿债：有现金流才不怕借债
      good:
        - 持续正且增长：造血能力强
        - 由负转正：商业模式跑通的标志
      bad:
        - 长期为负：靠融资续命
        - 利润涨现金反降：应收/存货积压
      policy:
        - 减税/补贴影响短期现金流
        - 资本开支监管（如限制无序扩张）
      example: 工资 1 万，房租伙食通勤必须花 6000，剩 4000 才是你能自由支配的。账面吹自己月入过万，不看他必须花多少。
