        fair: 5
    insights:
      affects:
        - 房贷月供：重定价日后按新 LPR 重算
        - 企业融资成本：LPR 降→贷款便宜
        - 银行息差：降太狠银行利润受压
      good:
        - 降 LPR：买房和借钱成本下降
        - 5 年期单独下调：托楼市信号
      bad:
        - LPR 不降但市场预期落空：股市银行地产回调
