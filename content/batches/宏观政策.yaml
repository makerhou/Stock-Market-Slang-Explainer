        example: 比如这个月公布的 5 年期以上报价比上个月降了 10 个基点，准备买房的人开始比较各家银行的实际利率。
        notMeaning: 你的实际利率 = LPR ± 固定点数，LPR 降不代表存量房贷马上降（看重定价日）。
