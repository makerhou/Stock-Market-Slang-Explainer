      - raw: 生产价格指数
        aliasType: cn_alias
    viz:
      type: CPIBasket
      config: {}
    insights:
      affects:
        - 企业利润：出厂价涨→利润改善；成本涨更多→被挤压
        - CPI：PPI 是 CPI 的先行官，上游涨价几个月后零售端常跟上
        - 政策：PPI 太高太低都会引来调控
      good:
        - 温和回升：说明工厂订单回暖、经济在恢复
        - PPI 止跌：通缩压力缓解，企业收入端改善
      bad:
        - 持续大跌：东西卖不上价，企业裁员减产
        - PPI 涨太猛：中下游小厂被成本压垮
      policy:
        - 大宗商品保供稳价：影响上游出厂成本
        - 环保限产/能耗双控：短期推高 PPI
      example: 菜贩从农民手里收菜 3 块、卖给你 5 块。农民进货价（PPI）涨到 4 块，菜贩熬一阵，迟早涨到 6 块卖给你。
  - slug: qu-ku-cun
    headword: 去库存
    categoryL1: 宏观经济
    categoryL2: 增长与产出
    difficulty: L1
    summaryPlain: 指企业把手里积压的存货卖出去，把库存降下来。
    riskNote: 库存高低只是经营信号之一，别据此判断买卖时机。
    frequency: mid
    popularity: 600
    senses:
      - senseKey: default
        plainExplain: 指企业把手里积压的存货卖出去，把库存降下来。
        example: 比如厂家把卖得慢的货降价促销，尽快回笼资金，仓库就不再越堆越多。
        notMeaning: 它说的是“存货多少”这个现象，不预测价格涨跌。
        isPrimary: true
        contextKeywords:
          - 存货
          - 促销
          - 回笼资金
          - 产能
        frequency: mid
    aliases:
      - raw: 去库存
        aliasType: primary
    viz:
      type: InventoryClear
      config: {}
    insights:
      affects:
        - 企业现金流回不回得来
        - 行业是否回暖
        - 相关股票业绩
      good:
        - 把积压货卖掉→回笼资金、减负
        - 说明需求回来了
      bad:
        - 卖不动只能压价甩卖、亏本
        - 库存高=占用钱、压力大
      policy:
        - 促消费、家电下乡帮去库存
        - 棚改货币化曾刺激地产库存
      example: 仓库堆了 1000 台旧空调卖不出，占着钱。打折促销卖掉 800 台→回笼资金、腾地方——这就是去库存。卖不掉就只能越压越贱。
