        - 超预期：紧缩恐慌
      policy:
        - 能源与房价权重影响读数
      example: 班主任最看重的科目（PCE）：其他科目（CPI）只是参考。班主任要看的那科没过线，全班（市场）补课。
  - slug: pmi
    headword: PMI
    categoryL1: 宏观经济
    categoryL2: 景气
    difficulty: L2
    summaryPlain: 问一堆采购经理「这个月生意比上个月好吗」统计出来的指数：50 是荣枯分界线。
    riskNote: 它是情绪问卷，不是硬数据；对股市只是参考，别当买卖依据。
    frequency: high
    popularity: 700
    senses:
      - senseKey: default
        plainExplain: 问一堆采购经理「这个月生意比上个月好吗」统计出来的指数：50 是荣枯分界线。
        example: 比如这个月问一圈工厂采购主管，都说订单比上个月多，统计出来读数在荣枯线以上，就说明景气在扩张。
        notMeaning: 它是情绪问卷，不是硬数据；对股市只是参考，别当买卖依据。
        isPrimary: true
        contextKeywords:
          - 景气
        frequency: high
    aliases:
      - raw: PMI
        aliasType: primary
      - raw: 采购经理指数
        aliasType: cn_alias
      - raw: 景气指数
        aliasType: cn_alias
    viz:
      type: GaugeBar
      config:
        title: PMI：50 是分界线
        min: 30
        max: 70
        threshold: 50
        initial: 52
        valueLabel: PMI 读数
        unit: ""
        zones:
          - min: 30
            max: 50
            label: 收缩区
            color: var(--down)
          - min: 50
            max: 70
            label: 扩张区
            color: var(--up)
        rows:
          - - "> 50"
            - 扩张：生意人觉得在变好
            - 班级过半数人说明天会更好
          - - < 50
            - 收缩：生意人觉得在变差
            - 过半数人说明天会更糟
          - - = 50
            - 荣枯线：和上月打平
            - 恰好好坏参半
    insights:
      affects:
        - 企业决策：PMI 好→敢备货扩产
        - 股市：PMI 反弹常被认为是经济见底信号
        - 债市：PMI 差→宽松预期升温
      good:
        - 站上 50 并连续走高：景气扩张
        - 新订单指数强：未来几个月的活有着落
      bad:
        - 掉到 50 以下：订单萎缩，企业收缩
        - 跌太快：往往是衰退的前哨
      policy:
        - 财政发力（基建订单）会推高建筑业 PMI
        - 出口退税/外贸政策影响新出口订单
      example: 开学问问全班「这个月零花钱变多了吗」：过半说多了就是扩张 PMI，过少说多了就是收缩。问卷快、但只是感觉，不是查钱包。
  - slug: ppi
