  - slug: cpi
    headword: CPI
    categoryL1: 宏观经济
    categoryL2: 物价指标
    difficulty: L1
    summaryPlain: 居民消费价格指数，跟踪一篮子日常用品和服务的价格变化，反映物价涨了多少、钱毛了没。
    riskNote: 它只看消费端价格，不涵盖房价这类资产价格。
    frequency: high
    popularity: 900
    senses:
      - senseKey: default
        plainExplain: 居民消费价格指数，跟踪一篮子日常用品和服务的价格变化，反映物价涨了多少、钱毛了没。
        example: 比如上个月菜价和房租一起往上走，这个指数就跟着抬升，说明通胀压力在变大。
        notMeaning: 它只看消费端价格，不涵盖房价这类资产价格。
        isPrimary: true
        contextKeywords:
          - 物价
          - 通胀
          - 指数
          - 生活成本
        frequency: high
    aliases:
      - raw: CPI
        aliasType: primary
      - raw: 居民消费价格指数
        aliasType: cn_alias
    viz:
      type: CPIBasket
      config: {}
    insights:
      affects:
        - 钱袋子：CPI 涨→同样的钱买更少东西
        - 央行：物价涨太快→可能加息；跌→可能降息
        - 股市：通胀太高→成本上升压利润
      good:
        - 温和上涨（比如 2% 左右）：经济活跃、买卖正常
        - 说明大家愿意消费、工厂有活干
      bad:
        - 涨太猛=钱毛了（通胀），东西贵到买不起
        - 一直跌=通缩，东西卖不动、工厂停产
      policy:
        - 货币放水（降准降息）容易推高 CPI
        - 收紧货币、补贴供给能压住物价
      example: 去年 100 块能买 10 斤苹果，今年只能买 8 斤——CPI 涨了，你的钱‘缩水’了。央行就盯着它决定要不要加息。
