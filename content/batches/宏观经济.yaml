  - slug: gdp
    headword: GDP
    categoryL1: 宏观经济
    categoryL2: 总量指标
    difficulty: L1
    summaryPlain: 一个国家或地区在一段时间里生产的全部最终商品和服务的市场价值总和，用来衡量经济块头有多大、长得快不快。
    riskNote: 它衡量的是生产规模，不直接等于老百姓的钱包变厚了。
    frequency: high
    popularity: 900
    senses:
      - senseKey: default
        plainExplain: 一个国家或地区在一段时间里生产的全部最终商品和服务的市场价值总和，用来衡量经济块头有多大、长得快不快。
        example: 比如新闻说上季度这块的总量比上一年同期多了一截，大家就判断经济在回暖。
        notMeaning: 它衡量的是生产规模，不直接等于老百姓的钱包变厚了。
        isPrimary: true
        contextKeywords:
          - 总量
          - 增长
          - 同比
          - 经济
        frequency: high
    aliases:
      - raw: GDP
        aliasType: primary
      - raw: 国内生产总值
        aliasType: cn_alias
    viz:
      type: GDPStack
      config: {}
    insights:
      affects:
        - 大盘：GDP 好→公司赚钱→股票易涨；差→易跌
        - 就业：产出多→好找工作、工资易涨
        - 政策：政府看它决定踩油门还是刹车
      good:
        - 同比正增长、稳稳地涨
        - 说明机器转得动、企业愿意扩产招人
      bad:
        - 增速下滑，甚至连续两季负增长（技术性衰退）
        - 说明订单少、失业多、大家不敢花钱
      policy:
        - 踩油门：降准降息、搞基建、减税、发消费券
        - 踩刹车：加息、收紧贷款、压住房价
      example: 把国家想成一个村子：今年包子铺多蒸了包子、游客来吃喝→总产出比去年多→GDP 涨了→大家收入涨、开了更多店。2020 疫情后政府发债搞基建+降准，让 GDP 重新回正。
