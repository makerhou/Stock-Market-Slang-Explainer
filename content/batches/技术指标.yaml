        example: 比如平均真实波幅 2 元的票，止损放 4 元外才不被日常波动扫掉。
        notMeaning: ATR 大说明波动大，止损要放宽、仓位要缩小。
        isPrimary: true
        contextKeywords:
          - 波动率
        frequency: mid
