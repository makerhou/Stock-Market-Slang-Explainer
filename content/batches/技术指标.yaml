            color: var(--color-muted)
          - min: 80
            max: 100
            label: 贴上轨：热
            color: var(--up)
    insights:
      affects:
        - 波动率：带宽放大=波动加剧、收窄=暴风雨前
        - 买卖参考：相对位置而非绝对价格
        - 策略：突破交易与均值回归两派
      good:
        - 触下轨回升：均值回归入场点
        - 带宽极窄后突破：趋势行情启动
      bad:
        - 触上轨不跌反涨：死在趋势里
        - 带宽骤张：变盘方向不明，风险大
      policy:
        - 市场流动性变化影响波动
        - 财报/事件让带宽不规则扩张
      example: 地铁进站的屏蔽门：正常时车在两条门轨之间晃，撞门=到边界。但有的车会直接顶破屏蔽门冲出去（趋势市）。
