  - slug: chou-ma-fen-bu
    headword: 筹码分布
    categoryL1: 技术指标
    categoryL2: 持仓成本
    difficulty: L2
    summaryPlain: 估算历史成交在各个价位的堆积，看多数人的持仓成本在哪里：哪里套牢盘重。
    riskNote: 它是估算不是事实；换手剧烈的票筹码结构说变就变。
    frequency: high
    popularity: 700
    senses:
      - senseKey: default
        plainExplain: 估算历史成交在各个价位的堆积，看多数人的持仓成本在哪里：哪里套牢盘重。
        example: 比如筹码峰集中在 12 元，而股价 8 元，说明上方有大批人被套，反弹到 12 元抛压重。
        notMeaning: 它是估算不是事实；换手剧烈的票筹码结构说变就变。
        isPrimary: true
        contextKeywords:
          - 持仓成本
        frequency: high
    aliases:
      - raw: 筹码分布
        aliasType: primary
      - raw: 成本分布
        aliasType: cn_alias
      - raw: CYQ
        aliasType: en_alias
    viz:
      type: TurnoverPie
      config:
        title: 筹码都在哪个价位
    insights:
      affects:
        - 支撑压力：筹码峰=真实成本区
        - 反弹压力：套牢盘密集区难突破
        - 洗盘判断：低位单峰密集易拉升
      good:
        - 低位单峰密集：洗盘充分
        - 筹码上移：低位筹码获利兑现
      bad:
        - 上方套牢盘厚：每次反弹都是逃命机会
        - 筹码分散：主力可能已经撤离
      policy:
        - 限售解禁改变筹码分布
        - 大宗交易价影响短期筹码结构
      example: 菜市场收摊后的账本：哪档菜卖了多少、赚没赚钱一目了然。套牢多的价位就是账本里刺眼的红色亏损行。
