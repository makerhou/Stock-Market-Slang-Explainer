            color: var(--down)
    insights:
      affects:
        - 仓位管理：波动大就少押
        - 止损设置：2 倍 ATR 是经典
      good:
        - ATR 收缩：变盘前夜
      bad:
        - ATR 飙升：危险期
      policy:
        - 事件驱动放大 ATR
      example: 公交车晃不晃：平路（低 ATR）能站着打瞌睡，山路（高 ATR）得抓稳扶手少动。
