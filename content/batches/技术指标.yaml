  - slug: ema
    headword: EMA
    categoryL1: 技术指标
    categoryL2: 均线
    difficulty: L3
    summaryPlain: 指数移动平均线：越近的日期权重越大的均线，比普通均线更敏感。
    riskNote: 敏感是双刃剑：假信号也更多，短线用得多。
    frequency: mid
    popularity: 620
    senses:
      - senseKey: default
        plainExplain: 指数移动平均线：越近的日期权重越大的均线，比普通均线更敏感。
        example: 比如 MACD 里的快线就是短期指数均线，拐头比普通均线早。
        notMeaning: 敏感是双刃剑：假信号也更多，短线用得多。
        isPrimary: true
        contextKeywords:
          - 均线
        frequency: mid
    aliases:
      - raw: EMA
        aliasType: primary
      - raw: 指数移动平均
        aliasType: cn_alias
      - raw: WMA
        aliasType: en_alias
    viz:
      type: CrossLines
      config:
        title: EMA：更重近期的均线
    insights:
      affects:
        - 短线择时：拐点更早
        - 策略基础：双 EMA 交叉系统
      good:
        - 反应快：趋势初期就识别
        - 适合波段跟踪
      bad:
        - 噪音多：震荡市反复交叉
      policy:
        - 权重参数由使用者设定
      example: 班主任算平均分：普通算法每人一票，EMA 算法给最近一次考试三倍权重——反应快但容易被一次意外带偏。
