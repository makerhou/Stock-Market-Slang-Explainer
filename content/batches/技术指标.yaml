terms:
  - slug: adx
    headword: ADX
    categoryL1: 技术指标
    categoryL2: 趋势强度
    difficulty: L3
    summaryPlain: 平均趋向指数：衡量趋势强弱的温度计，ADX 高说明有趋势、低说明在震荡。
    riskNote: 它只告诉你趋势多强，不告诉你方向。
    frequency: mid
    popularity: 620
    senses:
      - senseKey: default
        plainExplain: 平均趋向指数：衡量趋势强弱的温度计，ADX 高说明有趋势、低说明在震荡。
        example: 比如这个趋势强度指标从 20 升到 40，配合价格上行，说明单边行情成立。
        notMeaning: 它只告诉你趋势多强，不告诉你方向。
        isPrimary: true
        contextKeywords:
          - 趋势强度
        frequency: mid
    aliases:
      - raw: ADX
        aliasType: primary
      - raw: DMI
        aliasType: en_alias
      - raw: 趋向指标
        aliasType: cn_alias
    viz:
      type: Oscillator
      config:
        needles:
          - name: ADX
        initial:
          - 30
        max: 60
        zones:
          - min: 0
            max: 20
            label: 无趋势
            color: var(--color-muted)
          - min: 20
            max: 40
            label: 趋势形成
            color: var(--warn)
          - min: 40
            max: 60
            label: 强趋势
            color: var(--up)
    insights:
      affects:
        - 策略开关：ADX 低时别用趋势策略
        - 过滤：减少震荡市亏损
      good:
        - ADX 回升：趋势行情可跟随
      bad:
        - ADX 高位回落：趋势衰竭
      policy:
        - 市场波动环境影响读数
      example: 风力计：告诉你风多大（趋势强弱），但不告诉你在哪边。划船要看风向，冲浪要看浪高。
