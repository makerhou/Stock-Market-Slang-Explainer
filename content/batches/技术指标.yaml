  - slug: bu-lin-dai
    headword: 布林带
    categoryL1: 技术指标
    categoryL2: 波动
    difficulty: L2
    summaryPlain: 在均线上下各画一条「波动通道」：价格撞上轨太热、砸下轨太冷，通道收窄常常酝酿变盘。
    riskNote: 单边趋势里，价格可以沿上轨跑很久；把它当反转信号会死于趋势。
    frequency: high
    popularity: 700
    senses:
      - senseKey: default
        plainExplain: 在均线上下各画一条「波动通道」：价格撞上轨太热、砸下轨太冷，通道收窄常常酝酿变盘。
        example: 比如股价连续贴着布林上轨走，很多人还按「触轨卖出」老经验，结果错过主升浪。
        notMeaning: 单边趋势里，价格可以沿上轨跑很久；把它当反转信号会死于趋势。
        isPrimary: true
        contextKeywords:
          - 波动
        frequency: high
    aliases:
      - raw: 布林带
        aliasType: primary
      - raw: BOLL
        aliasType: en_alias
      - raw: 布林通道
