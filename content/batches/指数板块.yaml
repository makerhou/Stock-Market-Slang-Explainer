      - raw: 波动率指数
        aliasType: cn_alias
    viz:
      type: GaugeBar
      config:
        title: VIX：市场恐慌温度计
        min: 10
        max: 80
        threshold: 20
        initial: 28
        valueLabel: VIX 读数
        zones:
          - min: 10
            max: 20
            label: 淡定区
            color: var(--up)
          - min: 20
            max: 30
            label: 紧张区
            color: var(--warn)
          - min: 30
            max: 80
            label: 恐慌区
            color: var(--down)
        rows:
          - - "> 30"
            - 恐慌：大家在抢保险
            - 常伴随暴跌
          - - 20-30
            - 紧张：有点慌
            - 波动加大
          - - < 20
            - 淡定：岁月静好
            - 容易滋生自满
    insights:
      affects:
        - 衍生品定价：期权保险费的锚
        - 逆向指标：极端高读数常对应阶段性底部
        - 仓位管理：VIX 高时机构倾向防守
      good:
