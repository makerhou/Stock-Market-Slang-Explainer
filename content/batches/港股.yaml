        example: 腾讯涨 1%，和它挂钩的认购证可能涨 8%——这就是杠杆；腾讯不动，它照样可能跌 2%。
        notMeaning: 窝轮不是股票，没有股息也没有投票权。
        isPrimary: true
        contextKeywords:
          - 涡轮
          - 认股证
          - 杠杆
          - 发行商
        frequency: mid
    aliases:
