        - 短线资金：窝轮让散户以小博大，波动放大
        - 发行商：赚定价差和时间价值，散户是交易对手
      good:
        - 方向+时间都赌对：几天翻倍不稀奇
        - 对冲持仓：买认沽窝轮给正股上保险
      bad:
