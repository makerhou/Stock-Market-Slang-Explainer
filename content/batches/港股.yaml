        example: 港媒盘点过低价股名单，有只老牌地产股跌到几分钱，公司业务年年缩水，买一手像买废纸。
        notMeaning: 价格低≠被低估，很多仙股是烂公司跌出来的。
        isPrimary: true
        contextKeywords:
          - 低价股
