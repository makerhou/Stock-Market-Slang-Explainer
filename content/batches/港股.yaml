        - 杠杆杀：正股小跌，窝轮大跳水
      policy:
        - 有到期日：到期归零，不能当股票拿
        - 发行商报价义务：买卖差价可能被拉大
        - 无涨跌幅限制：窝轮单日腰斩常见
      example: 给出租屋装了个弹簧门：门槛低、弹力大——你小推一下（小钱）它能飞很远（大波动）。问题是时间久了弹簧会松（时间价值耗损），用错了方向门就砸你脸上。
