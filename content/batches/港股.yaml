        - 除牌机制：长期仙股可能被取消上市地位
        - 供股摊薄规则宽松：老千股惯用作案土壤
      example: 楼下小卖部的汽水 2 毛五一瓶，连锁超市卖 3 元——是超市抢钱吗？不一定：小卖部可能快撤摊、货还积压。股票也一样，几分钱常常是因为没人要、公司烂，而不是捡漏。
