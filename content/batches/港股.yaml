    categoryL1: 港股
    categoryL2: 杠杆产品
    difficulty: L3
    summaryPlain: 港股市场的「涡轮」：一种花小钱撬动正股涨跌的认购/认沽权证，杠杆大、损耗快。
    riskNote: 窝轮是零和的杠杆工具，时间价值每天都在流失，赌错归零。
