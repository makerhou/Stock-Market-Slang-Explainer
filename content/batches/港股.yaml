    popularity: 740
    senses:
      - senseKey: default
        plainExplain: 新股挂牌前一日由部分券商内部撮合的场外交易，为港股特有。
        example: 港股打新族流行「提前场先跑」：中签的可比正式上市早一天卖出锁定收益，这个场子里的暴涨常让没中签的人拍大腿。
        notMeaning: 暗盘不是官方市场，成交不受交易所规则约束。
        isPrimary: true
        contextKeywords:
          - 场外
          - 打新
          - 辉立
          - 挂暗盘
        frequency: high
    aliases:
      - raw: 暗盘
        aliasType: primary
      - raw: 灰市
        aliasType: cn_alias
      - raw: 上市前一天交易
        aliasType: cn_alias
    viz:
      type: GreyMarket
      config: {}
    insights:
      affects:
        - 打新决策：暗盘价是「上市会不会翻车」的预演
        - 正股：暗盘情绪传导到首日开盘价
        - 券商生意：辉立等提供暗盘撮合赚佣金收流量
      good:
        - 暗盘大涨 → 已中签者可提前落袋为安
        - 情绪爆棚的新股：暗盘数据是重要的卖出参考
      bad:
