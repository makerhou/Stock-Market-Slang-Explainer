  - slug: chu-jing
    headword: 除净
    categoryL1: 港股
    categoryL2: 权益分派
    difficulty: L2
    summaryPlain: 港股「除权除息」的统称：分红或送股的那天起，新买家不再享受这些权益，股价相应调整。
    riskNote: 除净后股价下调是技术性调整，不代表跌了；但填权/贴权走势决定你真实盈亏。
    frequency: mid
    popularity: 540
    senses:
      - senseKey: default
        plainExplain: 港股市场「除权除息」的合称：公司派息/送股后，首个交易日新投资者不再享有该权益。
        example: 某股宣布派息 1 元，除息日开盘参考价会自动扣掉这 1 元，K 线图上看起来「跌了」其实只是把利息划走了。
        notMeaning: 除净不是股价下跌，账面的市值缩水被现金分红补回。
        isPrimary: true
        contextKeywords:
          - 除息
          - 除权
          - 派息
          - 除净日
        frequency: mid
    aliases:
      - raw: 除净
        aliasType: primary
      - raw: 除权除息
        aliasType: cn_alias
      - raw: ex-entitlement
        aliasType: en_alias
    viz:
      type: ExRightAdjust
      config:
        title: 除净：蛋糕切小块，总数不变
    insights:
      affects:
        - 持仓者：分红/送股到账，账面除净价自动调整
        - 技术形态：历史 K 线常做除权修正避免假跌
        - 税负：港股通收取红利税，除净日规则影响收益
      good:
        - 高息股「填权」：股价涨回除净前水平=额外白拿息
        - 送股本身提升流动性、降低门槛
      bad:
        - 「贴权」：股价比除净价还低，等于白欢喜
        - 从众抢权息：除净前买、除净后被闷杀
      policy:
        - 港股通扣税规则：H 股 20%/红筹 28%（依据派息结构）
        - 除净定价规则：参考价=前收-派息/送股调整
        - T+2 交收影响港股通股东资格判定
      example: 披萨从 12 寸切 8 块变切 16 块：单块小了（除净价下调），但整张饼没少（总资产不变）。第二天大家发现块变小了就抛售，饼价跌回 12 寸的价÷16 块以下——那就是贴权；反过来被认可就是填权。
