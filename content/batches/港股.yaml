      type: MarketCapBar
      config:
        title: 仙股 vs 蓝筹：小盘到底有多小
    insights:
      affects:
        - 投资者一手成本极低，但公司基本面常常更差
        - 指数：仙股几乎永远进不了恒生指数这类旗舰指数
        - 壳市场：仙股常被借壳炒壳价
      good:
        - 低于 1 港元心理关口少：一部分人觉得跌无可跌
