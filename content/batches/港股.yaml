        - 短线资金：赌隔夜方向以小博大
        - 基金/老千：牛熊证是工具，中招多是散户
      good:
        - 方向对且没碰收回价：杠杆盈利极爽
        - 比窝轮规则简单：没有时间价值计算那么玄
      bad:
