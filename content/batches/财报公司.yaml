      example: 一块披萨切 4 块变切 8 块：块小了、能分的人多了，但披萨还是那张披萨。
  - slug: ding-zeng
    headword: 定增
    categoryL1: 财报公司
    categoryL2: 再融资
    difficulty: L3
    summaryPlain: 上市公司向少数特定对象（大机构、大股东）打折增发新股专门融资，和公开发行两码事。
    riskNote: 股本被摊薄；定增价倒挂、锁定到期减持都会带来压力。
    frequency: mid
    popularity: 560
    senses:
      - senseKey: default
        plainExplain: 定向增发：公司非公开地向不超过特定数量的机构/个人发行新股募集资金。
        example: 一家公司要建新厂，不愿对所有散户发新股，于是找几家大机构协议定价卖一批新股，只给这些人认购。
        notMeaning: 定增不是配股（面向老股东），也不是公开增发（面向所有人）。
        isPrimary: true
        contextKeywords:
          - 非公开
          - 增发
          - 机构
          - 摊薄
        frequency: mid
    aliases:
      - raw: 定增
        aliasType: primary
      - raw: 定向增发
        aliasType: cn_alias
    viz:
      type: PoolDilution
      config: {}
    insights:
      affects:
        - 公司：快速拿到扩产/并购的钱
        - 老股东：总股本变大，每股收益、控制权被稀释
        - 市场：定增价常被视为「机构认可的价值锚」
      good:
        - 项目投产兑现：业绩提升，摊薄被新增利润对冲
        - 知名机构捧场：释放看好信号
      bad:
        - 摊薄即期回报：EPS 被摊薄
        - 折价过大/利益输送质疑；到期解禁形成抛压
      policy:
        - 定价基准：不低于定价基准日前 20 日均价 80%
        - 锁定期：一般 6 个月/18 个月，到期才能卖
        - 再融资松紧周期：监管窗口影响发行节奏
      example: 三人合伙的披萨店要买新烤炉钱不够，按老规矩找熟人以 8 折价卖给他一份干股（定增）。钱到位炉子更好，但总份数从 12 块变 15 块——每块披萨变小了（摊薄），除非新烤炉带来 15 块以上的新生意。
