  - slug: xia-pu-bi-lv
    headword: 夏普比率
    categoryL1: 量化与风险
    categoryL2: 收益
    difficulty: L3
    summaryPlain: 每承担一单位波动换来的超额收益：衡量性价比，越高说明赚得稳。
    riskNote: 它假设风险=波动，但暴跌风险和平稳震荡在夏普眼里是一回事。
    frequency: high
    popularity: 700
    senses:
      - senseKey: default
        plainExplain: 每承担一单位波动换来的超额收益：衡量性价比，越高说明赚得稳。
        example: 比如两个产品都年化 15%，一个平稳向上一个暴涨暴跌，前者的风险调整后收益肯定高得多。
        notMeaning: 它假设风险=波动，但暴跌风险和平稳震荡在夏普眼里是一回事。
        isPrimary: true
        contextKeywords:
          - 收益
        frequency: high
    aliases:
      - raw: 夏普比率
        aliasType: primary
      - raw: Sharpe
        aliasType: en_alias
      - raw: 风险调整后收益
        aliasType: cn_alias
    viz:
      type: ProfitLossScale
      config:
        title: 收益 vs 波动的性价比
        mode: trap
        shares: 100
    insights:
      affects:
        - 策略比较：同收益率选波动小的
        - 仓位优化：性价比低的方向减
        - 基金筛选：专业机构的核心指标
      good:
        - 夏普 > 1：可接受的性价比
        - 夏普稳步抬升：策略进化
      bad:
        - 追求高夏普走极端：可能押注小概率
        - 事后夏普最优≠未来最优
      policy:
        - 利率变化影响超额收益基准
        - 市场环境切换让夏普失真
      example: 通勤路线：A 路线 40 分钟稳稳到，B 路线平均 20 分钟但一半概率迟到一小时。夏普比率算的就是这种「惊吓成本」。
